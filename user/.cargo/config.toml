[build]
# 默认 Base64 用户环境（RV64IMAC/LP64，FS=Off）；
# 需要 FP 的程序显式用 rinlib/riscv64gc-unknown-erhino-elf.json（LP64D）。
target = "rinlib/riscv64imac-unknown-erhino-elf.json"

# JSON target spec 解析许可；build-std 只用于目标构建（Justfile ZFLAGS_USER），
# 不能全局开启——否则 host 测试会与 sysroot 的 core/alloc 重复（同 os/）。
[unstable]
json-target-spec = true
