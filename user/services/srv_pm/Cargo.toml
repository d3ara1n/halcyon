[package]
name = "srv_pm"
version = "0.1.0"
authors = [ "Chien Zhang (d3ara1n@outlook.com)"]
description = "Process management"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libkernel = {path = "../../libraries/libkernel"}
librunnel = { path = "../../libraries/librunnel" }
libbudget = { path = "../../libraries/libbudget" }
libexecution = { path = "../../libraries/libexecution" }
libprocess = { path = "../../libraries/libprocess", features = ["management"] }
libruntime = { path = "../../libraries/libruntime" }
