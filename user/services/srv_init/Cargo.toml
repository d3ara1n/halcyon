[package]
name = "srv_init"
version = "0.1.0"
authors = ["Dearain (d3ara1n@outlook.com)"]
description = "Halcyon root supervisor and integration acceptance controller"
edition = "2024"

[features]
default = []
acceptance-stress = []
acceptance-memory = ["acceptance-stress"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libkernel = { path = "../../libraries/libkernel" }
erhino_shared = { path = "../../../shared/erhino_shared" }
librunnel = { path = "../../libraries/librunnel" }
librpc = { path = "../../libraries/librpc" }
libprocess = { path = "../../libraries/libprocess", features = ["management"] }
liboal = { path = "../../libraries/liboal" }
libfs = { path = "../../libraries/libfs" }
libservice = { path = "../../libraries/libservice" }
libbudget = { path = "../../libraries/libbudget" }
libexecution = { path = "../../libraries/libexecution" }
libruntime = { path = "../../libraries/libruntime" }
libthread = { path = "../../libraries/libthread" }
lock_api = "0.4"
test_fs = { path = "../../tests/test_fs" }
srv_fs = { path = "../srv_fs" }
tar = { path = "../../../shared/tar" }
