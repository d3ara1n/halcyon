[package]
name = "librunnel"
version = "0.1.0"
authors = ["Chien Zhang (zqy0224@live.com)"]
description = "Runnel streaming protocol over tunnel shared pages"
edition = "2024"

[dependencies]
erhino_shared = { path = "../../../shared" }

# 阻塞流式层依赖 rinlib（内含 RISC-V ecall），仅内核目标编译；
# 协议核心保持零 syscall 依赖，host 可测。
[target.'cfg(target_arch = "riscv64")'.dependencies]
rinlib = { path = "../../rinlib" }
