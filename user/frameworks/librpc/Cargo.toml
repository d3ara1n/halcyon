[package]
name = "librpc"
version = "0.1.0"
authors = ["Chien Zhang (zqy0224@live.com)"]
description = "Generic RPC framing over mailbox messages"
edition = "2024"

[dependencies]
monotonic_id = { path = "../../../shared/monotonic_id" }
erhino_shared = { path = "../../../shared/erhino_shared" }

# 同步调用层依赖 rinlib（RISC-V ecall），仅内核目标编译；
# framing 核心保持零 syscall 依赖，host 可测。
[target.'cfg(target_arch = "riscv64")'.dependencies]
rinlib = { path = "../../rinlib" }
libsrv = { path = "../libsrv" }
ordered_table = { path = "../../../shared/ordered_table" }
timer_queue = { path = "../../../shared/timer_queue" }
