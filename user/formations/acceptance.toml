# 独立领域验收；只装配本组 task，完成后由 init 正常收集并关机。
finish = "shutdown"

[job.kernel]
parent = "services"
pool = "kernel"

[instance.kernel]
image = "test_kernel"
kind = "task"
# 沿用原 core 四份工作集；压力覆盖层采用原五份，不据此声称精确峰值。
pool = { work_pages = 16384, metadata_bytes = 4194304 }
inputs."memory.pool" = "self/memory.pool"
inputs."kernel.job" = "init/job.kernel"
